<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hogwarts Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css">
</head>
<body class="login-page">
  <div class="form-container">
    <h2>Member Login</h2>

    <form id="loginForm">
      <label for="hogwartsId">🆔 Hogwarts ID</label>
      <input type="text" id="hogwartsId" required placeholder="your-hogwarts-id" />
      <label for="password">🔒 Password</label>
      <input type="password" id="password" required placeholder="••••••••" />
      <button type="submit">Enter facility booking</button>
    </form>

    <p>New here? <a href="../register/index.html">Register instead</a></p>
    <div id="loginResult"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('loginForm');
      const msg  = document.getElementById('loginResult');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.textContent = '';

        const hogwartsId = document.getElementById('hogwartsId').value.trim();
        const password   = document.getElementById('password').value;

        try {
          const res  = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ hogwartsId, password })
          });
          const data = await res.json().catch(() => ({}));

          if (!res.ok || data.ok !== true) throw new Error(data.error || 'Login failed');

          // Persist V4 identity
          const role = (data.role ?? data.user?.role ?? '').toLowerCase();
          const id   = data.id ?? data.user?.id ?? '';
          const hid  = data.hogwartsId ?? data.user?.hogwartsId ?? hogwartsId;

          if (id) localStorage.setItem('userId', String(id));
          localStorage.setItem('hogwartsId', hid);
          localStorage.setItem('role', role);

          // Route: only admins to /admin; everyone else to booking
          location.replace(role === 'admin' ? '/admin/index.html' : '/booking/index.html');
        } catch (err) {
          msg.style.color = '#ff9999';
          msg.textContent = `❌ ${err.message || 'Network error—please try again.'}`;
        }
      });
    });
  </script>
</body>
</html>
