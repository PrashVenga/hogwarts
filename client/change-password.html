<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Change Password</title>

  <!-- Hogwarts font (optional) -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="login-page">
  <div class="form-container">
    <h2>Change Password</h2>

    <!-- novalidate lets our JS handle messages; remove if you prefer native popups -->
    <form id="pwForm" novalidate>
      <label for="currPw">CURRENT PASSWORD</label>
      <input id="currPw" type="password" required placeholder="Enter current password">

      <label for="newPw">NEW PASSWORD</label>
      <input id="newPw" type="password" required minlength="6" placeholder="At least 6 characters">

      <label for="newPw2">CONFIRM NEW PASSWORD</label>
      <input id="newPw2" type="password" required placeholder="Re-type new password">

      <p id="pwMsg" class="auth-footer" style="min-height:1.2rem;"></p>
      <button type="submit" class="register-btn">Update Password</button>
    </form>

    <div class="auth-footer">
      <a href="booking.html">⬅ Back to Booking</a>
    </div>
  </div>

  <script>
    (function(){
      console.log('🔑 change-password page ready');

      const form = document.getElementById('pwForm');
      const msg  = document.getElementById('pwMsg');

      // guard: make sure elements exist
      if (!form || !msg) {
        console.error('❌ Form or message element not found');
        return;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.textContent = '';
        console.log('📝 submit fired');

        const username = localStorage.getItem('hogwartsId') || localStorage.getItem('username') || '';
        const currentPassword = document.getElementById('currPw')?.value || '';
        const newPassword     = document.getElementById('newPw')?.value || '';
        const newPassword2    = document.getElementById('newPw2')?.value || '';

        // basic checks (so it never looks like "nothing happens")
        if (!username) { msg.style.color='#ff9999'; msg.textContent='Please log in again.'; console.warn('no username'); return; }
        if (!currentPassword || !newPassword || !newPassword2) { msg.style.color='#ff9999'; msg.textContent='Fill in all fields.'; return; }
        if (newPassword.length < 6) { msg.style.color='#ff9999'; msg.textContent='Use at least 6 characters.'; return; }
        if (newPassword !== newPassword2) { msg.style.color='#ff9999'; msg.textContent='New passwords do not match.'; return; }

        try {
          console.log('📡 POST /api/change-password', { username });
          const res = await fetch('/api/change-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              hogwartsId: username,      // backend treats this as username
              currentPassword,
              newPassword
            })
          });

          const data = await res.json().catch(() => ({}));
          console.log('🔁 response', res.status, data);

          if (res.ok) {
            msg.style.color = '#b3ffb3';
            msg.textContent = '✅ Password updated, redirecting to LOGIN page...';
            setTimeout(() => {
              localStorage.clear();
              sessionStorage.clear();
              window.location.href = 'login.html';
            }, 1200);
          } else {
            msg.style.color = '#ff9999';
            msg.textContent = (data && (data.error || data.message))
              ? (data.error + (data.detail ? ' — ' + data.detail : ''))
              : 'Update failed';
          }
        } catch (err) {
          console.error('🌩 fetch error', err);
          msg.style.color = '#ff9999';
          msg.textContent = 'Network error — try again.';
        }
      });
    })();
  </script>
</body>
</html>
